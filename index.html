<!DOCTYPE html><html><head><title>Ideal Train - AI</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;background:#0a0a0a;color:white;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}header{padding:15px;background:#111;text-align:center;font-weight:bold;font-size:20px;border-bottom:1px solid #333}#chat{flex:1;overflow-y:auto;padding:15px}.msg{margin:10px 0;padding:12px;border-radius:12px;max-width:85%}.user{background:#fff;color:#000;margin-left:auto}.bot{background:#222;color:#fff}#box{display:flex;padding:12px;background:#111}input{flex:1;padding:12px;border-radius:25px;border:1px solid #333;background:#000;color:white;outline:none}button{margin-left:8px;padding:12px 18px;border-radius:25px;border:none;background:white;color:black;font-weight:bold}</style></head><body><header>ideal-train AI</header><div id="chat"><div class="msg bot">Hello! I am your AI assistant. Bolo kya help chahiye?</div></div><div id="box"><input id="inp" placeholder="Message..."><button onclick="send()">Send</button></div><script>function send(){let i=document.getElementById('inp');if(!i.value)return;let c=document.getElementById('chat');c.innerHTML+=`<div class="msg user">${i.value}</div>`;let q=i.value;i.value='';c.scrollTop=c.scrollHeight;setTimeout(()=>{c.innerHTML+=`<div class="msg bot">Aapne kaha: "${q}". Main is par kaam kar raha hun!</div>`;c.scrollTop=c.scrollHeight;},700);}</script></body></html>
